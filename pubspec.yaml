name: shokunin_koutei
description: "職人向けの工程表。現場の期間と節目を横の帯で見て、雨や遅れでまとめてずらし、画像やPDFで元請・お客さんに送る。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  pdf: ^3.13.1
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3
  in_app_purchase_storekit: ^0.4.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/NotoSansJP-Regular.ttf
    - assets/fonts/NotoSansJP-Bold.ttf
